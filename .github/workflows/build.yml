name: 编译补丁dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid

      - name: 编译dylib
        run: |
          make clean
          make

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassFixV1.dylib
          path: .theos/obj/debug/LiquidGlassFixV1.dylib
